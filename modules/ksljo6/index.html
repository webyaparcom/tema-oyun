<section class="modulex-referans-sekme-sektor{{fbsinif}}" {{fbetiket}}>

    {{fbbas}}

<style>
  /* referans-sekme-sektor — Referansları sektöre göre gruplar (sekme etkileşimi); çok sektörde çalışan firmalar için düz duvar yerine düzenli katalog. */
  .modulex-referans-sekme-sektor { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-referans-sekme-sektor *, .modulex-referans-sekme-sektor *::before, .modulex-referans-sekme-sektor *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-referans-sekme-sektor :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-referans-sekme-sektor :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-referans-sekme-sektor :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-referans-sekme-sektor :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-referans-sekme-sektor img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-referans-sekme-sektor) img { height: auto; }
  .modulex-referans-sekme-sektor [hidden] { display: none !important; }
  .modulex-referans-sekme-sektor :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-referans-sekme-sektor :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-referans-sekme-sektor-ic { max-width: --max--; margin-inline: auto; }
  .modulex-referans-sekme-sektor-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-referans-sekme-sektor--bassiz .modulex-referans-sekme-sektor-bas { display: none; }
  .modulex-referans-sekme-sektor-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-referans-sekme-sektor-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-referans-sekme-sektor-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-referans-sekme-sektor-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-referans-sekme-sektor-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-referans-sekme-sektor-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-referans-sekme-sektor-dugme:hover { transform: translateY(-2px); }
  .modulex-referans-sekme-sektor-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-referans-sekme-sektor-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-referans-sekme-sektor-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-referans-sekme-sektor-sekmeler { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-block-end: 28px; }
  .modulex-referans-sekme-sektor:not(.modulex-referans-sekme-sektor--js) .modulex-referans-sekme-sektor-sekmeler, .modulex-referans-sekme-sektor:not(.modulex-referans-sekme-sektor--js) .modulex-referans-sekme-sektor-panel:not(.modulex-referans-sekme-sektor-panel--ilk) { display: none; }
  .modulex-referans-sekme-sektor-sekme { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-weight: 650; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-referans-sekme-sektor-sekme:hover { border-color: --accent--; }
  .modulex-referans-sekme-sektor-sekme[aria-selected="true"] { border-color: --accent--; background: --accent--; color: --accentText--; }
  .modulex-referans-sekme-sektor-adet { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding-inline: 6px; border-radius: 999px; box-shadow: inset 0 0 0 1px currentColor; font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .modulex-referans-sekme-sektor-panel { animation: modulex-referans-sekme-sektor-gel 0.35s ease both; }
  .modulex-referans-sekme-sektor-liste { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .modulex-referans-sekme-sektor-kart > *, .modulex-referans-sekme-sektor-kart > .modulex-referans-sekme-sektor-bag { display: flex; align-items: center; gap: 14px; height: 100%; padding: 16px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --bg--; transition: border-color 0.3s ease, transform 0.3s ease; }
  .modulex-referans-sekme-sektor-kart:hover > * { border-color: --accent--; transform: translateY(-2px); }
  .modulex-referans-sekme-sektor-harf { display: grid; flex: none; place-items: center; width: 48px; height: 48px; overflow: hidden; border-radius: 12px; background: color-mix(in srgb, --accent-- 14%, --bg--); color: --accentInk--; font-weight: 800; }
  .modulex-referans-sekme-sektor-yazi { display: grid; gap: 2px; min-width: 0; }
  .modulex-referans-sekme-sektor-ad { font-size: 1rem; font-weight: 700; line-height: 1.3; }
  @keyframes modulex-referans-sekme-sektor-gel { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 1024px) { .modulex-referans-sekme-sektor-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 768px) { .modulex-referans-sekme-sektor-liste { grid-template-columns: minmax(0, 1fr); } .modulex-referans-sekme-sektor-sekmeler { justify-content: flex-start; } }
  .modulex-referans-sekme-sektor-logo { display: block; width: auto; max-width: 100%; height: clamp(32px, 4vw, 48px); object-fit: contain; filter: grayscale(1); transition: filter 0.3s ease, transform 0.3s ease; }
  .modulex-referans-sekme-sektor-kelime { display: inline-block; color: --text--; font-family: var(--mx-font-heading, inherit); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; transition: color 0.3s ease; }
  .modulex-referans-sekme-sektor-bag { color: inherit; text-decoration: none; }
  .modulex-referans-sekme-sektor-sektor { color: --accentInk--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-referans-sekme-sektor-kmetin { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-referans-sekme-sektor-yil { color: --muted--; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-referans-sekme-sektor-harf img { width: 100%; height: 100%; object-fit: contain; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-sekme-sektor :is(.modulex-referans-sekme-sektor-baslik, .modulex-referans-sekme-sektor-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-sekme-sektor-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-referans-sekme-sektor { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-referans-sekme-sektor *, .modulex-referans-sekme-sektor *::before, .modulex-referans-sekme-sektor *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-referans-sekme-sektor";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
