<section class="modulex-sayac-sutun-grafik{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-sutun-grafik-ic">

<style>
  /* sayac-sutun-grafik — Rakamları dikey sütun grafikte karşılaştırır (sayac-cubuk yataydır ve satır listesidir). */
  .modulex-sayac-sutun-grafik { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-sutun-grafik *, .modulex-sayac-sutun-grafik *::before, .modulex-sayac-sutun-grafik *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-sutun-grafik :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-sutun-grafik :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-sutun-grafik :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-sutun-grafik :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-sutun-grafik img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-sutun-grafik) img { height: auto; }
  .modulex-sayac-sutun-grafik [hidden] { display: none !important; }
  .modulex-sayac-sutun-grafik :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-sutun-grafik :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-sutun-grafik-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-sutun-grafik-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-sutun-grafik--bassiz .modulex-sayac-sutun-grafik-bas { display: none; }
  .modulex-sayac-sutun-grafik-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-sutun-grafik-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-sutun-grafik-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-sutun-grafik-bas { max-width: 760px; }
  .modulex-sayac-sutun-grafik-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-sutun-grafik-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-sutun-grafik-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-sutun-grafik-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-sutun-grafik-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-sutun-grafik-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-sutun-grafik-grafik { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: clamp(10px, 2.4vw, 32px); height: 400px; padding-block-end: 0; }
  .modulex-sayac-sutun-grafik-sutun { display: grid; grid-template-rows: auto 1fr auto; align-items: end; justify-items: stretch; gap: 10px; height: 100%; min-width: 0; text-align: center; }
  .modulex-sayac-sutun-grafik-cubuk { position: relative; display: grid; justify-items: center; align-content: start; height: calc(var(--oran) * 100%); padding-block-start: 12px; border-radius: 12px 12px 0 0; background: --accent--; color: --accentText--; border-block-end: 3px solid --text--; transition: height 1.3s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease; }
  .modulex-sayac-sutun-grafik--hazir:not(.modulex-sayac-sutun-grafik--gor) .modulex-sayac-sutun-grafik-cubuk { height: 0; }
  .modulex-sayac-sutun-grafik-sutun:hover .modulex-sayac-sutun-grafik-cubuk { filter: brightness(1.12); }
  .modulex-sayac-sutun-grafik-cubuk { align-self: end; }
  .modulex-sayac-sutun-grafik-ikon { font-size: 22px; }
  .modulex-sayac-sutun-grafik-sayi { font-size: clamp(1.2rem, 2.6vw, 2.1rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-sutun-grafik-ek { color: --accentInk--; font-size: 0.6em; }
  .modulex-sayac-sutun-grafik-etiket { min-height: 2.6em; font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
  @media (max-width: 768px) {
    .modulex-sayac-sutun-grafik-grafik { height: 300px; }
    .modulex-sayac-sutun-grafik-etiket { font-size: 0.78rem; }
    .modulex-sayac-sutun-grafik-ikon { display: none; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-sutun-grafik :is(.modulex-sayac-sutun-grafik-baslik, .modulex-sayac-sutun-grafik-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-sutun-grafik-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-sutun-grafik { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-sutun-grafik *, .modulex-sayac-sutun-grafik *::before, .modulex-sayac-sutun-grafik *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-sutun-grafik";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
